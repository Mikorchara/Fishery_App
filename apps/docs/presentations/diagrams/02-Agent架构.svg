<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI 助手架构</title><desc id="desc">用户在网页或 QQ 提问，助手理解问题。一般知识可直接解释，涉及当前或历史监测时按需查询数据后回答。</desc>
<defs>
<marker id="a0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#255ba9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a1" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#167166" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#694a9e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#405773" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f3f7fc" stroke="none" stroke-width="1.5"/>
<rect x="0" y="0" width="1600" height="9" rx="0" fill="#167166" stroke="none" stroke-width="1.5"/>
<text x="56" y="46" font-size="20" fill="#167166" font-weight="700" text-anchor="start" letter-spacing="2">智慧渔业监测系统</text>
<text x="55" y="109" font-size="52" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">AI 助手架构</text>
<text x="57" y="151" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">同一个 AI 助手，在网页和 QQ 都能用</text>
<rect x="56" y="206" width="5" height="19" rx="2" fill="#694a9e" stroke="none" stroke-width="1.5"/>
<text x="70" y="223" font-size="24" fill="#694a9e" font-weight="700" text-anchor="start" letter-spacing="0">用户提问</text>
<rect x="438" y="206" width="5" height="19" rx="2" fill="#255ba9" stroke="none" stroke-width="1.5"/>
<text x="452" y="223" font-size="24" fill="#255ba9" font-weight="700" text-anchor="start" letter-spacing="0">先理解问题</text>
<rect x="819" y="206" width="5" height="19" rx="2" fill="#167166" stroke="none" stroke-width="1.5"/>
<text x="833" y="223" font-size="24" fill="#167166" font-weight="700" text-anchor="start" letter-spacing="0">按问题类型处理</text>
<rect x="1223" y="206" width="5" height="19" rx="2" fill="#694a9e" stroke="none" stroke-width="1.5"/>
<text x="1237" y="223" font-size="24" fill="#694a9e" font-weight="700" text-anchor="start" letter-spacing="0">返回答案</text>
<rect x="56" y="371" width="300" height="158" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="57" y="386" width="4" height="128" rx="2" fill="#694a9e" stroke="none" stroke-width="1.5"/>
<text x="82" y="419" font-size="32" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">网页或 QQ</text>
<text x="82" y="459" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">现在鱼塘的水质</text>
<text x="82" y="493" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">怎么样？</text>
<rect x="438" y="371" width="300" height="158" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="439" y="386" width="4" height="128" rx="2" fill="#255ba9" stroke="none" stroke-width="1.5"/>
<text x="464" y="419" font-size="32" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">AI 助手</text>
<text x="464" y="459" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">结合前面的对话</text>
<text x="464" y="493" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">判断要不要查数据</text>
<rect x="819" y="264" width="323" height="158" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="820" y="279" width="4" height="128" rx="2" fill="#167166" stroke="none" stroke-width="1.5"/>
<text x="845" y="312" font-size="32" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">一般知识</text>
<text x="845" y="352" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">例如什么是溶解氧</text>
<text x="845" y="386" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">可以直接解释</text>
<rect x="819" y="478" width="323" height="158" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="820" y="493" width="4" height="128" rx="2" fill="#167166" stroke="none" stroke-width="1.5"/>
<text x="845" y="526" font-size="32" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">需要查询</text>
<text x="845" y="566" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">查水质、事件或养殖资料</text>
<text x="845" y="600" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">再根据结果回答</text>
<rect x="1223" y="371" width="321" height="158" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="1224" y="386" width="4" height="128" rx="2" fill="#694a9e" stroke="none" stroke-width="1.5"/>
<text x="1249" y="419" font-size="32" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">回复用户</text>
<text x="1249" y="459" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">在原对话中答复</text>
<text x="1249" y="493" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">引用数据时说明来源</text>
<polyline points="366,450 428,450" fill="none" stroke="#694a9e" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2)"/>
<polyline points="748,450 778,450 778,343 809,343" fill="none" stroke="#167166" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1)"/>
<polyline points="778,450 778,557 809,557" fill="none" stroke="#167166" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1)"/>
<polyline points="1152,343 1182,343 1182,450 1213,450" fill="none" stroke="#694a9e" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2)"/>
<polyline points="1152,557 1182,557 1182,450" fill="none" stroke="#694a9e" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="744" width="1488" height="83" rx="14" fill="#e5edf7" stroke="none" stroke-width="1.5"/>
<text x="82" y="796" font-size="23" fill="#255ba9" font-weight="700" text-anchor="start" letter-spacing="0">支持追问</text>
<text x="238" y="796" font-size="23" fill="#172b43" font-weight="400" text-anchor="start" letter-spacing="0">问“那溶解氧呢？”时，助手能接上话题。问到当前情况时，助手会重新查数据。</text>
</g></svg>
