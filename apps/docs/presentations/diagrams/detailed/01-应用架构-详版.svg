<text x="56" y="46" font-size="20" fill="#167166" font-weight="700" text-anchor="start" letter-spacing="2">智慧渔业监测系统</text>
<text x="1544" y="46" font-size="17" fill="#405773" font-weight="700" text-anchor="end" letter-spacing="2">详版  01 / 03</text>
<text x="55" y="109" font-size="52" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">应用架构</text>
<text x="57" y="151" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">从水质与鱼群检测，到异常记录和日常管理</text>
<rect x="56" y="183" width="5" height="19" rx="2" fill="#167166" stroke="none" stroke-width="1.5"/>
<text x="70" y="200" font-size="22" fill="#167166" font-weight="700" text-anchor="start" letter-spacing="0">数据从哪来</text>
<rect x="531" y="183" width="5" height="19" rx="2" fill="#255ba9" stroke="none" stroke-width="1.5"/>
<text x="545" y="200" font-size="22" fill="#255ba9" font-weight="700" text-anchor="start" letter-spacing="0">系统怎么处理</text>
<rect x="1163" y="183" width="5" height="19" rx="2" fill="#694a9e" stroke="none" stroke-width="1.5"/>
<text x="1177" y="200" font-size="22" fill="#694a9e" font-weight="700" text-anchor="start" letter-spacing="0">用户在哪里使用</text>
