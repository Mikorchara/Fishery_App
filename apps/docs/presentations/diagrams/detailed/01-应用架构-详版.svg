<text x="1186" y="722" font-size="22" fill="#694a9e" font-weight="700" text-anchor="start" letter-spacing="0">设备异常提醒范围</text>
<text x="1186" y="750" font-size="20" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">外观异常可发私聊。行为异常、</text>
<text x="1186" y="773" font-size="20" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">报告中断可在网页查看。</text>
