<text x="80" y="492" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">上报外观、行为和体长结果</text>
<text x="80" y="523" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">设备联调时单独接收</text>
<rect x="56" y="608" width="364" height="115" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="57" y="623" width="4" height="85" rx="2" fill="#167166" stroke="none" stroke-width="1.5"/>
