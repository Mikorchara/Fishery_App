<text x="80" y="686" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">项目自带资料，也可自行补充</text>
<rect x="531" y="222" width="521" height="161" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="532" y="237" width="4" height="131" rx="2" fill="#255ba9" stroke="none" stroke-width="1.5"/>
<text x="555" y="263" font-size="29" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">保存观测与报告</text>
<text x="555" y="300" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">记录来源、观测时间和数据状态</text>
<text x="555" y="331" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">合并同一报告的分包，重复上报去重</text>
<rect x="531" y="432" width="521" height="156" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="532" y="447" width="4" height="126" rx="2" fill="#255ba9" stroke="none" stroke-width="1.5"/>
<text x="555" y="473" font-size="29" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">按规则登记异常</text>
<text x="555" y="510" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">水质异常、外观或行为异常、报告中断</text>
<text x="555" y="541" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">持续异常可更新或升级</text>
<text x="555" y="572" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">可靠证据支持恢复，证据不足时待核实</text>
<rect x="531" y="608" width="521" height="115" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="532" y="623" width="4" height="85" rx="2" fill="#255ba9" stroke="none" stroke-width="1.5"/>
<text x="555" y="649" font-size="29" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">管理养殖资料</text>
<text x="555" y="686" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">浏览、编辑、检索项目资料</text>
<rect x="1163" y="222" width="381" height="207" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="1164" y="237" width="4" height="177" rx="2" fill="#694a9e" stroke="none" stroke-width="1.5"/>
<text x="1187" y="263" font-size="29" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">网页监测与管理</text>
<text x="1187" y="300" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">看当前水质和历史趋势</text>
<text x="1187" y="331" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">查看设备报告和事件详情</text>
<text x="1187" y="362" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">确认、结束或清理事件</text>
<text x="1187" y="393" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">维护资料并使用 AI 助手</text>
<rect x="1163" y="496" width="381" height="170" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="1164" y="511" width="4" height="140" rx="2" fill="#694a9e" stroke="none" stroke-width="1.5"/>
<text x="1187" y="537" font-size="29" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">QQ 问答与通知</text>
<text x="1187" y="574" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">授权成员在群里 @提问</text>
<text x="1187" y="605" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">部分异常可主动私聊提醒</text>
<text x="1187" y="636" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">接收人须先配对并启用通知</text>
