<text x="80" y="300" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">水温、酸碱度（pH）</text>
<text x="80" y="331" font-size="22" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">和溶解氧等指标</text>
<rect x="56" y="414" width="364" height="147" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
<rect x="57" y="429" width="4" height="117" rx="2" fill="#167166" stroke="none" stroke-width="1.5"/>
