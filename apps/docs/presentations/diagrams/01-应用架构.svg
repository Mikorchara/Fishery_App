<text x="1176" y="358" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">看水质、历史趋势</text>
<text x="1176" y="392" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">和异常事件</text>
<rect x="1150" y="484" width="394" height="152" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
