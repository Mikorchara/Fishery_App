<text x="82" y="532" font-size="32" fill="#172b43" font-weight="700" text-anchor="start" letter-spacing="0">检测设备</text>
<text x="82" y="572" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">上报鱼群外观、行为</text>
<text x="82" y="606" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">和体长等检测结果</text>
