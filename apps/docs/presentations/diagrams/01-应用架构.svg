<polyline points="1046,398 1093,398 1093,346 1140,346" fill="none" stroke="#694a9e" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2)"/>
<polyline points="1046,508 1093,508 1093,560 1140,560" fill="none" stroke="#694a9e" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2)"/>
<rect x="56" y="744" width="1488" height="83" rx="14" fill="#e5edf7" stroke="none" stroke-width="1.5"/>
<text x="82" y="796" font-size="23" fill="#255ba9" font-weight="700" text-anchor="start" letter-spacing="0">两种演示方式</text>
<text x="238" y="796" font-size="23" fill="#172b43" font-weight="400" text-anchor="start" letter-spacing="0">完整模拟时，数据由模拟器生成。连接设备时，水质继续模拟，鱼群检测结果由设备上报。</text>
</g></svg>
