<text x="570" y="422" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">接收并保存记录</text>
<text x="570" y="456" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">汇总水质和历史变化</text>
<text x="570" y="490" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">发现异常并登记事件</text>
<rect x="1150" y="270" width="394" height="152" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
