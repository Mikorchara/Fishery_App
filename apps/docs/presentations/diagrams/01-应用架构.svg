<text x="82" y="392" font-size="24" fill="#405773" font-weight="400" text-anchor="start" letter-spacing="0">和溶解氧等水质读数</text>
<rect x="56" y="484" width="373" height="152" rx="16" fill="#ffffff" stroke="#cad8e8" stroke-width="1.5"/>
